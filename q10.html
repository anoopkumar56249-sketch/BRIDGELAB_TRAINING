<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Selection Page</title>
</head>
<body>
  <h1>Travel Preferences</h1>

  <select name="country">
    <option value="india" selected>India</option>
    <option value="usa">USA</option>
    <option value="france">France</option>
  </select>
  <br><br>

  <select name="state">
    <option value="delhi" selected>Delhi</option>
    <option value="maharashtra">Maharashtra</option>
    <option value="karnataka">Karnataka</option>
  </select>
  <br><br>

  <select name="city">
    <option value="newdelhi" selected>New Delhi</option>
    <option value="mumbai">Mumbai</option>
    <option value="bangalore">Bangalore</option>
  </select>
  <br><br>

  <select name="touristplace">
    <option value="tajmahal" selected>Taj Mahal</option>
    <option value="eiffeltower">Eiffel Tower</option>
    <option value="statueofliberty">Statue of Liberty</option>
  </select>

  <p>Your selections: India, Delhi, New Delhi, Taj Mahal.</p>
</body>
</html>
