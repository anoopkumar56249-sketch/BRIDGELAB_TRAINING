<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Report</title>
</head>
<body>
  <h1>Green Valley Public School</h1>

      <th rowspan="2">Student</th>
      <th colspan="5">Subjects</th>

      <th rowspan="2">Percentage</th>

    <tr>
      <th>Math</th>
      <th>Science</th>
      <th>English</th>
      <th>History</th>
      <th>Computer</th>
    </tr>
    <tr>
      <td>Rita</td>
      <td>90</td>
      <td>88</td>
      <td>85</td>
      <td>80</td>
      <td>95</td>
      <td>438</td>
      <td>87.6%</td>
    </tr>
    <tr>
      <td>Arun</td>
      <td>82</td>
      <td>76</td>
      <td>89</td>
      <td>84</td>
      <td>91</td>
      <td>422</td>
      <td>84.4%</td>
    </tr>
    <tr>
      <td colspan="6" align="right"><strong>Overall</strong></td>
      <td>860</td>
      <td>86.0%</td>
    </tr>
  </table>
</body>
</html>
