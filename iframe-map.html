<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Map Iframe</title>
</head>
<body>
  <h1>My School Location</h1>
  <iframe
    src="https://www.google.com/maps?q=India%20Gate%2C%20New%20Delhi&output=embed"
    title="Map showing India Gate in New Delhi"
    width="80%"
    height="450"
    loading="lazy">
  </iframe>
  <p>The <code>loading="lazy"</code> attribute delays loading the map until it is close to the visible area, which can improve the initial page loading speed.</p>
</body>
</html>
