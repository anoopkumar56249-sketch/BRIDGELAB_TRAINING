<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box Model</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="page">
  <h1>CSS Box Model</h1>
  <section class="margin-layer">
    <div class="border-layer">
      <div class="padding-layer">
        <div class="content-layer">Content</div>
      </div>
    </div>
  </section>
  <section class="info">
    <p><strong>Margin:</strong> outer space around the element.</p>
    <p><strong>Border:</strong> edge surrounding padding and content.</p>
    <p><strong>Padding:</strong> inner space between content and border.</p>
    <p><strong>Content:</strong> the actual text or element area.</p>
    <p><strong>box-sizing: border-box:</strong> includes padding and border inside the declared size.</p>
  </section>
</main>
</body>
</html>
