<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced CSS Selectors</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <h1>Advanced CSS Selectors</h1>
  <section class="items">
    <input type="text" placeholder="Text input">
    <a href="https://example.com">Secure Link</a>
    <ul>
      <li>First item</li><li>Second item</li><li>Third item</li>
    </ul>
    <div class="parent"><p>Direct child paragraph</p><span>Sibling span</span><span>Another span</span></div>
  </section>
</main>
</body>
</html>
