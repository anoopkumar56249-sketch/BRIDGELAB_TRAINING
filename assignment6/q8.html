<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q8 - Photo Gallery</title>
  <link rel="stylesheet" href="q8.css">
</head>
<body>
  <main class="gallery-page">
    <header class="gallery-header"><div><p class="eyebrow">A QUIET COLLECTION</p><h1>Light, line, landscape.</h1></div><p>Eight moments from the edge of the city.</p></header>
    <section class="gallery" aria-label="Photo gallery">
      <figure class="tall"><div class="scene scene-one"></div><figcaption>Morning / 06:14</figcaption></figure>
      <figure><div class="scene scene-two"></div><figcaption>Blue hour / 18:42</figcaption></figure>
      <figure class="wide"><div class="scene scene-three"></div><figcaption>After rain / 09:28</figcaption></figure>
      <figure><div class="scene scene-four"></div><figcaption>Low tide / 17:05</figcaption></figure>
      <figure class="tall"><div class="scene scene-five"></div><figcaption>Open road / 12:31</figcaption></figure>
      <figure><div class="scene scene-six"></div><figcaption>Last light / 20:16</figcaption></figure>
    </section>
  </main>
</body>
</html>
