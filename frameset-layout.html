<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frameset Layout</title>
</head>
<frameset rows="20%,65%,15%">
  <frame src="navigation.html" name="navigation" title="Navigation frame">
  <frame src="home.html" name="content" title="Content frame">
  <frame src="welcome.html" name="welcome" title="Welcome frame">
  <noframes>
    <body>
      <p>Your browser does not support frames. Visit the <a href="home.html">home page</a>.</p>
    </body>
  </noframes>
</frameset>
</html>
